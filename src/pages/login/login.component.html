<div class="main-container">
    <div class="login-form-container">
        <h2>~ Login to Revolution ~</h2>
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
        <div class="form-group">
            <label for="email">~ Email ~</label>
            <br/>
            <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="userLoginRequest.email" 
            required 
            class="form-control"
            placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="password">~ Password ~</label>
            <br/>
            <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="userLoginRequest.password" 
            required 
            class="form-control"
            placeholder="Enter your password">
        </div>

        <div class="form-group">
            <button type="submit" [disabled]="!loginForm.form.valid" class="btn submit-btn">Click to login</button>
            <br/>
            <br/>
            You don't have account? <a routerLink="/register"> Click to register!</a>
        </div>
        </form>
    </div>
</div>
