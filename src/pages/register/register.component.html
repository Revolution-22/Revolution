<div class="main-container">
  <div class="login-form-container">
    <h2>~ Register to Revolution ~</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="nickname">~ Nickname ~</label>
        <br />
        <input
          type="text"
          id="nickname"
          formControlName="nickname"
          class="form-control"
          placeholder="Enter your nickname"
        />
        <div
          *ngIf="
            registerForm.get('nickname')?.invalid &&
            registerForm.get('nickname')?.touched
          "
          class="error"
        >
          Nickname is required!
        </div>
      </div>

      <div class="form-group">
        <label for="email">~ Email ~</label>
        <br />
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="Enter your email"
        />
        <div
          *ngIf="
            registerForm.get('email')?.invalid &&
            registerForm.get('email')?.touched
          "
          class="error"
        >
          Email is required and must be valid!
        </div>
      </div>

      <div class="form-group">
        <label for="password">~ Password ~</label>
        <br />
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Enter your password"
        />
        <div
          *ngIf="
            registerForm.get('password')?.invalid &&
            registerForm.get('password')?.touched
          "
          class="error"
        >
          Password is required!
        </div>
      </div>

      <div class="form-group">
        <button
          type="submit"
          [disabled]="registerForm.invalid"
          class="btn submit-btn"
        >
          Click to register
        </button>
        <br />
        <br />
        You have an account? <a routerLink="/login">Click to login!</a>
      </div>
    </form>
  </div>
</div>
