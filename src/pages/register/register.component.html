<div class="main-container">
    <div class="login-form-container">
        <h2>~ Register to Revolution ~</h2>
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">

        <div class="form-group">
            <label for="nickname">~ Nickname ~</label>
            <br/>
            <input 
            type="text" 
            id="nickname" 
            name="nickname" 
            [(ngModel)]="userRegisterRequest.nickname" 
            required 
            class="form-control"
            placeholder="Enter your nickname">
        </div>

        <div class="form-group">
            <label for="email">~ Email ~</label>
            <br/>
            <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="userRegisterRequest.email" 
            required 
            class="form-control"
            placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="password">~ Password ~</label>
            <br/>
            <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="userRegisterRequest.password" 
            required 
            class="form-control"
            placeholder="Enter your password">
        </div>

        <div class="form-group">
            <button type="submit" [disabled]="!loginForm.form.valid" class="btn submit-btn">Click to register</button>
            <br/>
            <br/>
            You have account? <a routerLink="/login"> Click to login!</a>
        </div>
        </form>
    </div>
</div>
